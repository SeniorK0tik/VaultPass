[package]
name = "seif"
description = "Сейф — локальное хранилище паролей и записей"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "seif_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "seif"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vault-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
zeroize.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
parking_lot = "0.12"
dirs = "6"

# Эмуляция ввода для автозаполнения. На Wayland синтетический ввод в чужое
# окно запрещён протоколом, поэтому на Linux это работает только под X11.
enigo = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
