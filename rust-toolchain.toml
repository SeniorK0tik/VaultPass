# Версия компилятора закреплена намеренно.
#
# На rustc 1.96 сборка падает с SIGSEGV на крейте glib-macros 0.18.5. Это не
# наш код: glib 0.18 приходит из стека gtk-rs, на котором Tauri рисует окна в
# Linux, и его версия зафиксирована самим Tauri — обойти её нельзя.
# Проверено: дело не в стеке (падает и с RUST_MIN_STACK=512 МиБ) и не в битых
# исходниках (переизвлечение не помогает).
#
# 1.90 собирает проект целиком. Снять закрепление можно, когда Tauri перейдёт
# на gtk-rs 0.19+ либо когда сбой починят в rustc.
[toolchain]
channel = "1.90.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
